[workspace]
members = [
    "server",
    "apps/desktop/src-tauri",
    "crates/semble-core",
    "support/benchmarks/semble",
]
resolver = "2"

# Keep local Rust builds compact. Full dependency debug info and incremental
# object caches dominate target/ in this workspace, while line tables for our
# own crates are enough for normal backtraces and source-level debugging.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

# Preflight streams a large LZMA installer, including in debug desktop builds.
[profile.dev.package.lzma-rust2]
opt-level = 3

[profile.test.package.lzma-rust2]
opt-level = 3
