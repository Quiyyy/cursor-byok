[package]
name = "cursor-protocol-native-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cursor-server = { path = "../../../server" }
axum = "0.8"
hudsucker = { version = "0.25", features = ["http2"] }
rcgen = { version = "0.14", features = ["aws_lc_rs", "pem", "x509-parser"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


